[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enneadtab-logger"
version = "0.0.1"
description = "EnneadTab usage-logging lane (client stubs; ErrorDump=errors, InfraWatch=infra, logger=usage)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "EnneadTab EcoSystem" }]
keywords = ["enneadtab", "usage", "telemetry", "logging"]

[project.urls]
Home = "https://github.com/EnneadTab-EcoSystem/enneadtab-logger"
Source = "https://github.com/EnneadTab-EcoSystem/enneadtab-logger"
Issues = "https://github.com/EnneadTab-EcoSystem/enneadtab-logger/issues"

[tool.setuptools.packages.find]
where = ["src"]
